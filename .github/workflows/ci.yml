name: Syntel CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --exclude=.venv,venv,env,Syntel- --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style/complexity warnings
          flake8 . --exclude=.venv,venv,env,Syntel- --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Django System Check
        env:
          DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production-use"
          DJANGO_DEBUG: "True"
          DISABLE_HTTPS_SECURITY: "1"
        run: |
          python manage.py check --settings=syntel.test_settings

      - name: Run Tests
        env:
          DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production-use"
          DJANGO_DEBUG: "True"
          DISABLE_HTTPS_SECURITY: "1"
        run: |
          python manage.py test purchases.tests --settings=syntel.test_settings
