{% extends 'base.html' %}

{% block title %}افزودن ایراد فاکتور{% endblock %}

{% block content %}
<div class="ui-page is-narrow">

    <header class="ui-topbar">
        <div class="ui-heading">
            <h1 class="ui-title">
                <i class="fas fa-exclamation-triangle" style="color:var(--primary,#8B5CF6);font-size:1.1rem;"></i>
                افزودن ایراد فاکتور جدید
            </h1>
            <p class="ui-subtitle">نام عنوان ایراد را برای استفاده در ثبت و فیلتر فاکتورها وارد کنید</p>
        </div>
        <div class="ui-topbar-actions">
            <a href="{% url 'invoice_issue_list' cafe_code=cafe_code %}" class="ui-btn ui-btn-ghost">
                <i class="fas fa-arrow-right"></i> بازگشت
            </a>
        </div>
    </header>

    <div class="ui-form-card">
        <form method="post">
            {% csrf_token %}
            <div class="ui-field">
                <label class="ui-field-label" for="name">نام ایراد *</label>
                <input type="text" name="name" id="name" class="ui-input" required placeholder="مثال: مغایرت مبلغ، فاقد امضا...">
            </div>
            <div class="ui-form-actions">
                <a href="{% url 'invoice_issue_list' cafe_code=cafe_code %}" class="ui-btn ui-btn-ghost">انصراف</a>
                <button type="submit" class="ui-btn ui-btn-primary">
                    <i class="fas fa-save"></i> ذخیره
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
