{% extends 'base.html' %}

{% block title %}تأیید حذف ایراد فاکتور{% endblock %}

{% block content %}
<div class="ui-page is-narrow">
    <div class="ui-confirm-card">
        <div style="text-align:center;margin-bottom:1.1rem;">
            <div style="width:48px;height:48px;border-radius:12px;background:var(--ui-danger-bg);color:var(--ui-danger);display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:0.6rem;">
                <i class="fas fa-trash"></i>
            </div>
            <h1 class="ui-title" style="justify-content:center;margin-bottom:0.35rem;">تأیید حذف</h1>
            <p class="ui-subtitle" style="justify-content:center;">آیا مطمئن هستید که می‌خواهید ایراد "{{ issue.name }}" را حذف کنید؟</p>
        </div>

        <div class="ui-banner is-danger" style="margin-bottom:1.25rem;justify-content:center;">
            <i class="fas fa-exclamation-triangle" style="margin-top:0.15rem;"></i>
            <span>این عملیات قابل بازگشت نیست.</span>
        </div>

        <form method="post" style="display:flex;gap:0.65rem;justify-content:center;">
            {% csrf_token %}
            <a href="{% url 'invoice_issue_list' cafe_code=cafe_code %}" class="ui-btn ui-btn-ghost">انصراف</a>
            <button type="submit" class="ui-btn ui-btn-danger">
                <i class="fas fa-trash"></i> حذف
            </button>
        </form>
    </div>
</div>
{% endblock %}
