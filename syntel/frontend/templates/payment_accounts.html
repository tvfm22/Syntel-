{% extends 'base.html' %}
{% load static custom_filters %}

{% block title %}حساب‌های پرداخت{% endblock %}

{% block content %}
<div class="ui-page is-narrow">

    <header class="ui-topbar">
        <div class="ui-heading">
            <h1 class="ui-title">
                <i class="fas fa-wallet" style="color:var(--primary,#8B5CF6);font-size:1.1rem;"></i>
                حساب‌های پرداخت
            </h1>
            <p class="ui-subtitle">تعریف و مدیریت حساب‌های بانکی پرداخت کافه</p>
        </div>
        <div class="ui-topbar-actions">
            <a href="{% url 'debt_list' cafe_code=cafe_code %}" class="ui-btn ui-btn-ghost">
                <i class="fas fa-arrow-right"></i> بازگشت به لیست بدهی
            </a>
        </div>
    </header>

    <section class="ui-card">
        <div class="ui-card-body">
            {% include 'partials/_payment_accounts_panel.html' %}
        </div>
    </section>

</div>
{% endblock %}
