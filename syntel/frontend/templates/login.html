<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود به سیستم Syntel</title>
    
    <!-- Vazir Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(10px);
        }
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .logo h1 {
            color: #1f2937;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .logo p {
            color: #6b7280;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #1f2937;
            font-weight: 600;
            font-size: 15px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Vazir', sans-serif;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            font-family: 'Vazir', sans-serif;
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:active {
            transform: translateY(-1px);
        }
        .messages {
            margin-bottom: 24px;
        }
        .alert {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px 16px;
            border-radius: 12px;
            border-right: 4px solid #ef4444;
            font-weight: 500;
        }
        .demo-users {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e5e7eb;
            font-size: 13px;
            color: #6b7280;
        }
        .demo-users h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #1f2937;
            font-weight: 600;
        }
        .demo-users p {
            margin-bottom: 10px;
            line-height: 1.8;
        }
        .demo-users code {
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #667eea;
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">S</div>
            <h1>Syntel</h1>
            <p>سیستم مدیریت خرید کافه</p>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">ورود</button>
        </form>

        <div class="demo-users">
            <h3>🔐 کاربران نمایش</h3>
            <p><strong>آشپزخانه:</strong> <code>kitchen</code> / <code>pass123</code></p>
            <p><strong>بار:</strong> <code>bar</code> / <code>pass123</code></p>
            <p><strong>کانتر:</strong> <code>counter</code> / <code>pass123</code></p>
            <p><strong>خرید:</strong> <code>purchasing</code> / <code>pass123</code></p>
            <p><strong>مدیر:</strong> <code>manager</code> / <code>pass123</code></p>
        </div>
    </div>
</body>
</html>
