{% comment %}
استایل مشترک مودال‌ها، فرم رسپی و دکمهٔ btn-sm —
در بلوک extra_css صفحات بهای تمام شده include می‌شود.
{% endcomment %}
<style>
    /* ═══ پوستهٔ مشترک مودال‌های بهای تمام شده (هماهنگ با سیستم مینیمال مدرن) ═══ */
    .cogs-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(15, 23, 42, 0.42);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 1.25rem;
        overflow-y: auto;
    }
    .cogs-modal.is-open {
        display: flex;
        align-items: flex-start;
        justify-content: center;
    }
    .cogs-modal-box {
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: 18px;
        box-shadow: 0 24px 64px rgba(15, 23, 42, 0.18);
        width: 100%;
        max-width: 920px;
        margin: auto;
        overflow: hidden;
        animation: cgModalIn 0.16s ease-out;
    }
    @keyframes cgModalIn {
        from { opacity: 0; transform: translateY(8px) scale(0.985); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cogs-modal-box.is-narrow { max-width: 540px; }
    .cogs-modal-box.is-medium { max-width: 740px; }
    .cogs-modal-box.is-wide   { max-width: 1020px; }

    .cogs-modal-head {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1.05rem 1.35rem;
        border-bottom: 1px solid var(--border-light);
    }
    .cogs-modal-head h3 {
        font-size: 1rem;
        font-weight: 800;
        color: var(--text-primary);
        margin: 0;
    }
    .cogs-modal-head .modal-sub {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.12rem;
    }
    .cogs-modal-close {
        margin-inline-start: auto;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--border-default);
        background: var(--bg-card);
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.15s ease;
    }
    .cogs-modal-close:hover {
        background: var(--gray-100);
        color: var(--text-primary);
    }
    .cogs-modal-body {
        padding: 1.2rem 1.35rem;
        max-height: calc(100vh - 220px);
        overflow-y: auto;
    }
    .cogs-modal-foot {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.85rem 1.35rem;
        border-top: 1px solid var(--border-light);
        background: var(--gray-50);
    }
    .cogs-modal-foot .spacer { margin-inline-start: auto; }
    .cogs-modal-foot .btn {
        height: 36px;
        padding: 0 1rem;
        border-radius: 10px;
        font-size: 0.8rem;
    }

    /* دکمهٔ کوچک داخل مودال‌ها و بخش‌ها */
    .btn-sm {
        display: inline-flex;
        align-items: center;
        gap: 0.32rem;
        height: 32px;
        padding: 0 0.72rem;
        border-radius: 8px;
        border: 1px solid var(--border-default);
        background: var(--bg-card);
        color: var(--text-secondary);
        cursor: pointer;
        font-family: 'Vazir', sans-serif;
        font-size: 0.74rem;
        font-weight: 600;
        transition: all 0.15s ease;
    }
    .btn-sm:hover {
        border-color: var(--primary-light);
        color: var(--primary-dark);
        background: rgba(139, 92, 246, 0.05);
    }
    .btn-sm.is-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #FFFFFF;
        font-weight: 700;
    }
    .btn-sm.is-primary:hover {
        background: var(--primary-dark);
        border-color: var(--primary-dark);
        color: #FFFFFF;
    }

    /* ═══ فرم رسپی ═══ */
    .recipe-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
        margin-bottom: 1.1rem;
    }
    .recipe-field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
    }
    .recipe-field label {
        font-size: 0.73rem;
        font-weight: 700;
        color: var(--text-secondary);
    }
    .recipe-field input,
    .recipe-field select {
        height: 36px;
        padding: 0 0.7rem;
        width: 100%;
        border: 1px solid var(--border-default);
        border-radius: 10px;
        background: var(--bg-card);
        color: var(--text-primary);
        font-family: 'Vazir', sans-serif;
        font-size: 0.81rem;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .recipe-field input:focus,
    .recipe-field select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .recipe-lines-head {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 0.55rem;
    }
    .recipe-lines-head h4 {
        font-size: 0.83rem;
        font-weight: 800;
        color: var(--text-primary);
        margin: 0;
    }
    .recipe-lines {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
    }
    .recipe-line {
        display: grid;
        grid-template-columns: minmax(0, 1.75fr) 84px 84px 108px 32px;
        gap: 0.45rem;
        align-items: center;
        background: var(--gray-50);
        border: 1px solid var(--border-light);
        border-radius: 11px;
        padding: 0.45rem 0.55rem;
    }
    .recipe-line select,
    .recipe-line input {
        height: 34px;
        padding: 0 0.55rem;
        width: 100%;
        border: 1px solid var(--border-default);
        border-radius: 8px;
        background: var(--bg-card);
        color: var(--text-primary);
        font-family: 'Vazir', sans-serif;
        font-size: 0.79rem;
    }
    .recipe-line select:focus,
    .recipe-line input:focus {
        outline: none;
        border-color: var(--primary);
    }
    .recipe-line .line-material { flex: 1 1 0; min-width: 0; }
    .recipe-line .line-cost {
        text-align: center;
        font-size: 0.8rem;
        font-weight: 800;
        color: #047857;
        font-variant-numeric: tabular-nums;
    }
    .recipe-line .line-cost.is-empty { color: var(--text-muted); font-weight: 600; }
    .line-del {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        width: 28px;
        height: 28px;
        border-radius: 8px;
        font-size: 0.8rem;
        transition: background 0.15s ease, color 0.15s ease;
    }
    .line-del:hover { background: #FEF2F2; color: #DC2626; }

    .line-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        font-size: 0.64rem;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        margin-inline-start: 4px;
        white-space: nowrap;
        border: 1px solid transparent;
        font-family: 'Vazir', sans-serif;
    }
    .line-badge.is-raw  { background: #EFF6FF; color: #2563EB; }
    .line-badge.is-prep { background: #FFFBEB; color: #B45309; }
    .line-badge.is-dish { background: rgba(139, 92, 246, 0.10); color: var(--primary-dark); }
    button.line-badge.is-link { cursor: pointer; transition: all 0.15s ease; }
    button.line-badge.is-prep.is-link { border-color: #FDE68A; }
    button.line-badge.is-prep.is-link:hover { background: #FEF3C7; border-color: #F59E0B; }
    button.line-badge.is-dish.is-link { border-color: rgba(139, 92, 246, 0.30); }
    button.line-badge.is-dish.is-link:hover { background: rgba(139, 92, 246, 0.18); border-color: var(--primary); }

    .recipe-back-btn {
        display: none;
        align-items: center;
        gap: 0.35rem;
        height: 30px;
        padding: 0 0.68rem;
        border-radius: 8px;
        border: 1px solid var(--border-default);
        background: var(--gray-50);
        color: var(--text-primary);
        cursor: pointer;
        font-family: 'Vazir', sans-serif;
        font-size: 0.74rem;
        font-weight: 700;
        flex-shrink: 0;
        transition: all 0.15s ease;
    }
    .recipe-back-btn.is-visible { display: inline-flex; }
    .recipe-back-btn:hover { border-color: var(--primary); color: var(--primary-dark); }
    .recipe-lines-hint { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .recipe-total {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1rem;
        padding: 0.85rem 1.1rem;
        background: #ECFDF5;
        border: 1px solid #D1FAE5;
        border-radius: 12px;
    }
    .recipe-total .rt-label { font-size: 0.76rem; font-weight: 700; color: #065F46; }
    .recipe-total .rt-value {
        font-size: 1.25rem;
        font-weight: 800;
        color: #047857;
        font-variant-numeric: tabular-nums;
    }
    .recipe-total .rt-unit { font-size: 0.75rem; color: #065F46; }
    .recipe-total .rt-note { margin-inline-start: auto; font-size: 0.71rem; color: #047857; opacity: 0.85; }

    .recipe-alert {
        display: none;
        margin-bottom: 0.75rem;
        padding: 0.6rem 0.85rem;
        border-radius: 10px;
        font-size: 0.79rem;
        font-weight: 600;
        background: #FEF2F2;
        color: #B91C1C;
        border: 1px solid #FECACA;
    }
    .recipe-alert.is-open { display: block; }

    @media (max-width: 900px) {
        .recipe-grid { grid-template-columns: repeat(2, 1fr); }
        .recipe-line { grid-template-columns: minmax(0, 1fr) 70px 70px 32px; }
        .recipe-line .line-cost { display: none; }
    }
</style>
