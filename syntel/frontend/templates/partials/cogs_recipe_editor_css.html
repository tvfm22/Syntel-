{% comment %}
استایل مشترک مودال‌ها، فرم رسپی و دکمهٔ btn-sm —
در بلوک extra_css هر دو صفحهٔ بهای تمام شده include می‌شود.
{% endcomment %}
<style>

    /* ═══ پوستهٔ مشترک مودال‌های بهای تمام شده ═══ */
    .cogs-modal {
        display: none; position: fixed; inset: 0; z-index: 1200;
        background: rgba(15,23,42,0.45); backdrop-filter: blur(2px);
        padding: var(--space-6); overflow-y: auto;
    }
    .cogs-modal.is-open { display: flex; align-items: flex-start; justify-content: center; }
    .cogs-modal-box {
        background: var(--bg-card); border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-xl); width: 100%; max-width: 940px;
        margin: auto; overflow: hidden;
    }
    .cogs-modal-box.is-narrow { max-width: 560px; }
    .cogs-modal-box.is-medium { max-width: 760px; }
    .cogs-modal-box.is-wide { max-width: 1040px; }
    .cogs-modal-head {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-4) var(--space-5);
        border-bottom: 1px solid var(--border-light);
    }
    .cogs-modal-head h3 { font-size: 0.98rem; font-weight: 800; margin: 0; }
    .cogs-modal-head .modal-sub { font-size: 0.75rem; color: var(--text-secondary); }
    .cogs-modal-close {
        margin-inline-start: auto; background: none; border: none; cursor: pointer;
        width: 30px; height: 30px; border-radius: var(--radius-sm);
        color: var(--text-secondary); font-size: 0.95rem;
    }
    .cogs-modal-close:hover { background: var(--gray-100); color: var(--danger); }
    .cogs-modal-body { padding: var(--space-5); max-height: calc(100vh - 220px); overflow-y: auto; }
    .cogs-modal-foot {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-3) var(--space-5);
        border-top: 1px solid var(--border-light); background: var(--bg-subtle);
    }
    .cogs-modal-foot .spacer { margin-inline-start: auto; }

    /* دکمهٔ کوچک داخل مودال‌ها */
    .btn-sm {
        display: inline-flex; align-items: center; gap: 0.3rem;
        height: 32px; padding: 0 0.7rem; border-radius: var(--radius-sm);
        border: 1px solid var(--border-default); background: var(--bg-card);
        color: var(--text-secondary); cursor: pointer;
        font-family: 'Vazir', sans-serif; font-size: 0.74rem; font-weight: 700;
    }
    .btn-sm:hover { border-color: var(--accent-indigo); color: var(--accent-indigo); }
    .btn-sm.is-primary {
        background: var(--accent-indigo); border-color: var(--accent-indigo); color: #fff;
    }
    .btn-sm.is-primary:hover { background: var(--primary-dark); color: #fff; }

    /* ═══ فرم رسپی ═══ */
    .recipe-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3);
        margin-bottom: var(--space-4);
    }
    .recipe-field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .recipe-field label { font-size: 0.74rem; font-weight: 700; color: var(--text-secondary); }
    .recipe-field input, .recipe-field select {
        height: 38px; padding: 0 0.6rem; width: 100%;
        border: 1px solid var(--border-default); border-radius: var(--radius-md);
        background: var(--bg-card); color: var(--text-primary);
        font-family: 'Vazir', sans-serif; font-size: 0.82rem;
    }
    .recipe-field input:focus, .recipe-field select:focus {
        outline: none; border-color: var(--accent-indigo);
        box-shadow: 0 0 0 3px rgba(139,92,246,0.10);
    }

    .recipe-lines-head {
        display: flex; align-items: center; gap: var(--space-3);
        margin-bottom: var(--space-2);
    }
    .recipe-lines-head h4 { font-size: 0.82rem; font-weight: 800; margin: 0; }
    .recipe-lines { display: flex; flex-direction: column; gap: 6px; }
    .recipe-line {
        display: grid;
        grid-template-columns: minmax(0, 1.75fr) 84px 84px 108px 34px;
        gap: 6px; align-items: center;
        background: var(--bg-subtle); border: 1px solid var(--border-light);
        border-radius: var(--radius-md); padding: 6px;
    }
    .recipe-line select, .recipe-line input {
        height: 34px; padding: 0 0.5rem; width: 100%;
        border: 1px solid var(--border-default); border-radius: var(--radius-sm);
        background: var(--bg-card); color: var(--text-primary);
        font-family: 'Vazir', sans-serif; font-size: 0.79rem;
    }
    .recipe-line select:focus, .recipe-line input:focus {
        outline: none; border-color: var(--accent-indigo);
    }
    .recipe-line .line-cost {
        text-align: center; font-size: 0.79rem; font-weight: 800;
        color: var(--accent-green); font-variant-numeric: tabular-nums;
    }
    .recipe-line .line-cost.is-empty { color: var(--text-muted); font-weight: 600; }
    .line-del {
        background: none; border: none; cursor: pointer; color: var(--text-muted);
        width: 28px; height: 28px; border-radius: var(--radius-sm); font-size: 0.8rem;
    }
    .line-del:hover { background: rgba(239,68,68,0.10); color: var(--danger); }
    .line-badge {
        font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 999px;
        margin-inline-start: 4px; white-space: nowrap;
    }
    .line-badge.is-raw { background: rgba(59,130,246,0.10); color: var(--accent-blue); }
    .line-badge.is-prep { background: rgba(249,115,22,0.12); color: var(--accent-orange); }

    .recipe-total {
        display: flex; align-items: center; gap: var(--space-4);
        margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
        background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.22);
        border-radius: var(--radius-lg);
    }
    .recipe-total .rt-label { font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); }
    .recipe-total .rt-value {
        font-size: 1.25rem; font-weight: 900; color: var(--accent-green);
        font-variant-numeric: tabular-nums;
    }
    .recipe-total .rt-unit { font-size: 0.75rem; color: var(--text-secondary); }
    .recipe-total .rt-note { margin-inline-start: auto; font-size: 0.7rem; color: var(--text-muted); }

    .recipe-alert {
        display: none; margin-bottom: var(--space-3); padding: 0.6rem 0.85rem;
        border-radius: var(--radius-md); font-size: 0.79rem; font-weight: 600;
        background: rgba(239,68,68,0.08); color: var(--danger);
        border: 1px solid rgba(239,68,68,0.22);
    }
    .recipe-alert.is-open { display: block; }

    @media (max-width: 900px) {
        .recipe-grid { grid-template-columns: repeat(2, 1fr); }
        .recipe-line { grid-template-columns: minmax(0,1fr) 70px 70px 34px; }
        .recipe-line .line-cost { display: none; }
    }
</style>
