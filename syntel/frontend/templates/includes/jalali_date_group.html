{% comment %}
باکس تاریخ شمسی — همان ظاهر «ثبت فاکتور نقدی»
پارامترها:
  jd_name  : نام فیلد ارسالی (مثلاً date / date_from / date_to)
  jd_id    : شناسهٔ ورودی مخفی (یکتا در صفحه)
  jd_value : مقدار اولیه به شکل YYYY/MM/DD شمسی
{% endcomment %}
<input type="hidden" name="{{ jd_name }}" id="{{ jd_id }}" value="{{ jd_value|default:'' }}">
<div class="date-input-group" data-jalali-group="{{ jd_id }}">
    <input type="number" data-jd="year" placeholder="سال" min="1300" max="1500" inputmode="numeric" autocomplete="off" aria-label="سال شمسی">
    <span class="date-separator">/</span>
    <input type="number" data-jd="month" placeholder="ماه" min="1" max="12" inputmode="numeric" autocomplete="off" aria-label="ماه شمسی">
    <span class="date-separator">/</span>
    <input type="number" data-jd="day" placeholder="روز" min="1" max="31" inputmode="numeric" autocomplete="off" aria-label="روز شمسی">
</div>
