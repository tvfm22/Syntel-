{% extends 'base.html' %}

{% block title %}تأیید حذف درخواست‌کننده - Kuker{% endblock %}

{% block content %}
<div class="ui-confirm-card">
    <div class="confirm-icon"><i class="fas fa-trash-can"></i></div>
    <h1 class="ph-title" style="margin-bottom:0.4rem;">تأیید حذف درخواست‌کننده</h1>
    <p class="page-sub" style="margin-bottom:1rem;">آیا مطمئن هستید که می‌خواهید درخواست‌کننده «<b>{{ requester.get_name_display }}</b>» را حذف کنید؟</p>
    <p style="color:var(--danger);font-size:0.82rem;font-weight:700;margin-bottom:1.5rem;">این عملیات قابل بازگشت نیست.</p>
    <form method="post" style="display:flex;gap:0.75rem;justify-content:center;">
        {% csrf_token %}
        <a href="{% url 'requester_list' cafe_code=cafe_code %}" class="btn btn-secondary">انصراف</a>
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> حذف</button>
    </form>
</div>
{% endblock %}
