{% extends 'base.html' %}

{% block title %}ثبت درخواست خرید - Syntel{% endblock %}

{% block extra_css %}
<style>
        * {
            box-sizing: border-box;
        }

        .page-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .user-badge {
            display: inline-block;
            background: #f3f4f6;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .items-container {
            margin-bottom: 1.5rem;
        }

        .item-row {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }

        .item-row:hover {
            border-color: #9ca3af;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .item-number {
            background: #6366f1;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .remove-item-btn {
            background: transparent;
            color: #dc2626;
            border: none;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-family: 'Vazir', sans-serif;
            transition: opacity 0.2s;
        }

        .remove-item-btn:hover {
            opacity: 0.7;
        }

        .item-fields {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        .form-control,
        select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: 'Vazir', sans-serif;
            transition: border-color 0.2s;
        }

        .form-control:focus,
        select:focus {
            outline: none;
            border-color: #6366f1;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 60px;
        }

        .add-item-btn {
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            color: #6b7280;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            display: block;
            width: 100%;
            margin-bottom: 1.5rem;
            font-family: 'Vazir', sans-serif;
        }

        .add-item-btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            padding-top: 1rem;
        }

        .btn {
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: 'Vazir', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #6366f1;
            color: white;
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .page-container {
                padding: 1rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .item-fields {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
{% endblock %}

{% block content %}

<div class="page-container">
    <div class="page-header">
        <h1>ثبت درخواست خرید</h1>
        <div class="user-badge">{{ user.get_role_display }}</div>
    </div>

    <form method="post" id="purchaseForm">
        {% csrf_token %}
        
        <div class="items-container">
            <div id="itemsWrapper">
                <!-- Items will be added here by JavaScript -->
            </div>
            <button type="button" class="add-item-btn" onclick="addItem()">
                + افزودن کالا
            </button>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                ارسال درخواست
            </button>
            <a href="{% url 'mobile_dashboard' cafe_code=cafe_code %}" class="btn btn-secondary">
                انصراف
            </a>
        </div>
    </form>
</div>

{% endblock %}

{% block extra_js %}
<script>
        let itemCount = 0;

        // Product name field - no preset selection needed

        function addItem() {
            itemCount++;
            const itemHtml = `
                <div class="item-row" id="item-${itemCount}">
                    <div class="item-header">
                        <div class="item-number">${itemCount}</div>
                        <button type="button" class="remove-item-btn" onclick="removeItem(${itemCount})">× حذف</button>
                    </div>
                    <div class="item-fields">
                        <div class="form-group">
                            <label>نام کالا *</label>
                            <input type="text" name="product_name" class="form-control" placeholder="نام کالا را وارد کنید..." required>
                        </div>
                        <div class="form-group">
                            <label>مقدار *</label>
                            <input type="number" name="item_quantity" class="form-control" step="0.01" placeholder="0" required>
                        </div>
                        <div class="form-group">
                            <label>واحد</label>
                            <select name="item_unit" class="form-control">
                                <option value="عدد">عدد</option>
                                <option value="کیلوگرم">کیلوگرم</option>
                                <option value="گرم">گرم</option>
                                <option value="لیتر">لیتر</option>
                                <option value="بسته">بسته</option>
                                <option value="کارتن">کارتن</option>
                                <option value="جعبه">جعبه</option>
                                <option value="شیشه">شیشه</option>
                                <option value="قوطی">قوطی</option>
                                <option value="بطری">بطری</option>
                                <option value="پاکت">پاکت</option>
                                <option value="متر">متر</option>
                                <option value="سانتی‌متر">سانتی‌متر</option>
                                <option value="دست">دست</option>
                                <option value="جفت">جفت</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 0.75rem;">
                        <label>توضیحات</label>
                        <textarea name="item_description" class="form-control" rows="2" placeholder="توضیحات اختیاری..."></textarea>
                    </div>
                </div>
            `;
            document.getElementById('itemsWrapper').insertAdjacentHTML('beforeend', itemHtml);
        }

        function removeItem(id) {
            const items = document.querySelectorAll('.item-row');
            if (items.length > 1) {
                const itemElement = document.getElementById(`item-${id}`);
                if (itemElement) {
                    itemElement.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => {
                        itemElement.remove();
                        updateItemNumbers();
                    }, 300);
                }
            } else {
                alert('⚠️ باید حداقل یک کالا در درخواست باشد!');
            }
        }

        function updateItemNumbers() {
            const items = document.querySelectorAll('.item-row');
            items.forEach((item, index) => {
                const numberBadge = item.querySelector('.item-number');
                if (numberBadge) {
                    numberBadge.textContent = index + 1;
                }
            });
        }

        // Add first item on page load
        window.addEventListener('load', function() {
            addItem();
        });

        // Form validation
        document.getElementById('purchaseForm').addEventListener('submit', function(e) {
            const items = document.querySelectorAll('.item-row');
            if (items.length === 0) {
                e.preventDefault();
                alert('⚠️ لطفاً حداقل یک کالا اضافه کنید');
                return false;
            }
            
            // Check if all required fields are filled
            let allValid = true;
            items.forEach(item => {
                const productNameInput = item.querySelector('input[name="product_name"]');
                const quantityInput = item.querySelector('input[name="item_quantity"]');
                
                if (!productNameInput || !productNameInput.value.trim()) {
                    allValid = false;
                    productNameInput.style.borderColor = 'var(--danger-color)';
                }
                if (!quantityInput || !quantityInput.value) {
                    allValid = false;
                    quantityInput.style.borderColor = 'var(--danger-color)';
                }
            });
            
            if (!allValid) {
                e.preventDefault();
                alert('⚠️ لطفاً تمام فیلدهای ضروری را پر کنید');
                return false;
            }
        });

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from { opacity: 1; transform: translateY(0); }
                to { opacity: 0; transform: translateY(-20px); }
            }
        `;
        document.head.appendChild(style);
    </script>
{% endblock %}
