{% comment %}
نوار زیرصفحه‌های ماژول «بهای تمام شده».
هر سه صفحهٔ ماژول این فایل را با {% include %} وارد می‌کنند و متغیر
`cogs_page` (menu | items | consumption) تب فعال را مشخص می‌کند.
{% endcomment %}
<nav class="cogs-nav" aria-label="زیرصفحه‌های بهای تمام شده">
    <a href="{% url 'cogs_menu_list' cafe_code=cafe_code %}"
       class="cogs-nav-tab{% if cogs_page == 'menu' %} is-active{% endif %}">
        <i class="fas fa-utensils"></i><span>لیست غذاهای منو</span>
    </a>
    <a href="{% url 'cogs_manage_items' cafe_code=cafe_code %}"
       class="cogs-nav-tab{% if cogs_page == 'items' %} is-active{% endif %}">
        <i class="fas fa-tags"></i><span>افزودن آیتم و قیمت‌گذاری کالاها</span>
    </a>
    <a href="{% url 'cogs_consumption_calc' cafe_code=cafe_code %}"
       class="cogs-nav-tab{% if cogs_page == 'consumption' %} is-active{% endif %}">
        <i class="fas fa-calculator"></i><span>محاسبه میزان مصرف مواد اولیه</span>
    </a>
</nav>
