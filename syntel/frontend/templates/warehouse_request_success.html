{% extends 'base.html' %}
{% block title %}درخواست ثبت شد - Kuker{% endblock %}
{% block content %}
<div style="max-width:520px; margin: 3rem auto; text-align: center;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-3xl); box-shadow: var(--shadow-md); padding: 2.5rem 2rem;">
        <div style="width:76px;height:76px;border-radius:50%;background:rgba(34,197,94,0.12);color:#059669;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.2rem;">
            <i class="fas fa-check"></i>
        </div>
        <h1 style="color: var(--text-primary); font-size: 1.25rem; font-weight: 800; margin-bottom: 0.6rem;">درخواست از انبار ثبت شد</h1>
        <p style="color: var(--text-secondary); font-size: 0.86rem; margin-bottom: 2rem; line-height: 1.9;">درخواست شما با موفقیت ثبت گردید و توسط مسئول انبار/خرید بررسی خواهد شد.</p>
        <div style="display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'mobile_dashboard' cafe_code=cafe_code %}"
               style="background: var(--accent-indigo); color: white; padding: 0.55rem 1.3rem; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.82rem;">
                <i class="fas fa-arrow-right"></i> بازگشت به داشبورد
            </a>
            <a href="{% url 'warehouse_request_form' cafe_code=cafe_code %}"
               style="background: var(--accent-green, #22C55E); color: white; padding: 0.55rem 1.3rem; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.82rem;">
                <i class="fas fa-plus"></i> ثبت درخواست جدید
            </a>
            <a href="{% url 'warehouse_requests_list' cafe_code=cafe_code %}"
               style="background: var(--bg-card); border: 1.5px solid var(--border-default); color: var(--text-secondary); padding: 0.55rem 1.3rem; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.82rem;">
                <i class="fas fa-list"></i> لیست درخواست‌های من
            </a>
        </div>
    </div>
</div>
{% endblock %}
