{% extends 'base.html' %}
{% block title %}درخواست ثبت شد{% endblock %}
{% block content %}
<div style="max-width:500px; margin: 3rem auto; text-align: center; padding: 2rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">📦✅</div>
    <h1 style="color: #10b981; font-size: 1.75rem; margin-bottom: 1rem;">درخواست از انبار ثبت شد</h1>
    <p style="color: #6b7280; margin-bottom: 2rem;">درخواست شما با موفقیت ثبت گردید و توسط مسئول انبار/خرید بررسی خواهد شد.</p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="{% url 'warehouse_request_form' cafe_code=cafe_code %}" 
           style="background: #10b981; color: white; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600;">
            ثبت درخواست جدید
        </a>
        <a href="{% url 'warehouse_requests_list' cafe_code=cafe_code %}"
           style="background: #f3f4f6; color: #374151; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600;">
            لیست درخواست‌های من
        </a>
    </div>
</div>
{% endblock %}
