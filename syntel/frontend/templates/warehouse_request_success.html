{% extends 'base.html' %}
{% block title %}درخواست ثبت شد - Kuker{% endblock %}
{% block content %}
<div class="ui-page is-narrow">
    <div class="ui-card" style="max-width:520px; width:100%; margin:2.5rem auto; text-align:center;">
        <div class="ui-card-body" style="padding:2.4rem 1.8rem;">
            <div style="width:72px;height:72px;border-radius:50%;background:var(--ui-ok-bg);border:1px solid var(--ui-ok-border);color:var(--ui-ok);display:flex;align-items:center;justify-content:center;font-size:1.85rem;margin:0 auto 1.2rem;">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="ui-title" style="justify-content:center; margin-bottom:0.6rem;">درخواست از انبار ثبت شد</h1>
            <p style="color:var(--text-secondary);font-size:0.86rem;margin:0 auto 1.8rem;line-height:1.85;max-width:380px;">
                درخواست شما با موفقیت ثبت گردید و توسط مسئول انبار/خرید بررسی خواهد شد.
            </p>
            <div style="display:flex;gap:0.55rem;justify-content:center;flex-wrap:wrap;">
                <a href="{% url 'mobile_dashboard' cafe_code=cafe_code %}" class="ui-btn ui-btn-primary">
                    <i class="fas fa-arrow-right"></i> بازگشت به داشبورد
                </a>
                <a href="{% url 'warehouse_request_form' cafe_code=cafe_code %}" class="ui-btn ui-btn-success">
                    <i class="fas fa-plus"></i> ثبت درخواست جدید
                </a>
                <a href="{% url 'warehouse_requests_list' cafe_code=cafe_code %}" class="ui-btn ui-btn-ghost">
                    <i class="fas fa-list"></i> لیست درخواست‌های من
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
