{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تست Select2</title>
    <link href="{% static 'vendor/bootstrap/bootstrap-5.1.3.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/select2/select2.min.css' %}" rel="stylesheet" />
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            padding: 50px;
        }
        .select2-container {
            width: 100% !important;
        }
        .select2-container--default .select2-selection--single {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            height: 38px;
            padding: 0.4rem 0.75rem;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 22px;
            padding-right: 0;
            padding-left: 20px;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            left: 5px;
            right: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>تست Select2 با دسته‌بندی‌ها</h2>
        <div class="mb-3">
            <label class="form-label">دسته‌بندی:</label>
            <select class="form-select category-select" id="test-select">
                <option value="">انتخاب...</option>
                <option value="1">تره بار</option>
                <option value="2">تره بار › هویج</option>
                <option value="3">تره بار › گوجه</option>
                <option value="4">تره بار › خیار</option>
                <option value="5">لبنیات</option>
                <option value="6">لبنیات › شیر</option>
                <option value="7">لبنیات › ماست</option>
            </select>
        </div>
        <div class="alert alert-info">
            می‌توانید در باکس بالا تایپ کنید و دسته‌بندی مورد نظر را جستجو کنید.
        </div>
    </div>
    
    <script src="{% static 'vendor/jquery/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'vendor/select2/select2.min.js' %}"></script>
    <script>
        $(document).ready(function() {
            $('#test-select').select2({
                placeholder: "جستجو و انتخاب دسته‌بندی...",
                allowClear: true,
                dir: "rtl",
                language: {
                    noResults: function() {
                        return "نتیجه‌ای یافت نشد";
                    },
                    searching: function() {
                        return "در حال جستجو...";
                    }
                },
                width: '100%'
            });
        });
    </script>
</body>
</html>
